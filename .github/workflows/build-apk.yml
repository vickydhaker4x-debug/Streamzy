name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Setup API 36
        run: |
          # Accept all SDK licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          # Install compileSdkVersion 36 platform
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Capacitor Android & Inject VD Music Icons
        run: |
          npx cap add android || true
          node scripts/generate-android-assets.js
          npx cap sync android
          node scripts/generate-android-assets.js

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VD-Music-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Copy and Commit APK to Repository
        run: |
          mkdir -p build-outputs
          cp android/app/build/outputs/apk/debug/app-debug.apk build-outputs/app-debug.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add build-outputs/app-debug.apk
          git commit -m "chore: update compiled app-debug.apk [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Failed to push APK to branch"
