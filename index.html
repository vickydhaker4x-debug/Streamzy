<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Streamzy - High-Fidelity Music Streaming</title>
    <meta name="description" content="Streamzy is a high-fidelity music streaming client featuring modular stream plugins, offline vault caching, 10-band DSP equalizer, and real-time synchronized lyrics." />
    <meta property="og:title" content="Streamzy - High-Fidelity Music Streaming" />
    <meta property="og:description" content="Streamzy is a high-fidelity music streaming client featuring modular stream plugins, offline vault caching, 10-band DSP equalizer, and real-time synchronized lyrics." />
    <link rel="icon" type="image/jpeg" href="/streamzy_logo.jpg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#131317" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/streamzy_logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
      /* Immediate 0ms paint styles to eliminate black/white flash on cold launch */
      html, body {
        background-color: #131317 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #pre-root-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #131317;
        z-index: 999999;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .pre-splash-logo {
        width: 100px;
        height: 100px;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        animation: preSplashPulse 2s ease-in-out infinite;
      }
      .pre-splash-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .pre-splash-title {
        margin-top: 24px;
        font-size: 24px;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.92);
        letter-spacing: -0.03em;
      }
      .pre-splash-gradient {
        background: linear-gradient(135deg, #f87171, #ec4899, #06b6d4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @keyframes preSplashPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.03); opacity: 1; }
      }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body class="bg-[#131317] text-[#e4e1e7] antialiased selection:bg-[#f87171]/30 selection:text-[#ffb3b0]">
    <div id="root">
      <div id="pre-root-splash">
        <div class="pre-splash-logo">
          <img src="/streamzy_logo.jpg" alt="Streamzy" />
        </div>
        <div class="pre-splash-title">
          Stream<span class="pre-splash-gradient">zy</span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
