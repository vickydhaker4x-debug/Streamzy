<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Streamzy - High-Fidelity Music Streaming</title>
    <meta name="description" content="Streamzy is a high-fidelity music streaming client featuring modular stream plugins, offline vault caching, 10-band DSP equalizer, and real-time synchronized lyrics." />
    <meta property="og:title" content="Streamzy - High-Fidelity Music Streaming" />
    <meta property="og:description" content="Streamzy is a high-fidelity music streaming client featuring modular stream plugins, offline vault caching, 10-band DSP equalizer, and real-time synchronized lyrics." />
    <link rel="icon" type="image/jpeg" href="/streamzy_logo.jpg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#131317" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/streamzy_logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
      /* Immediate 0ms paint styles to eliminate black/white flash on cold launch */
      html, body {
        background-color: #131317 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #streamzy-loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #131317;
        z-index: 9999999;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: auto;
      }
      #streamzy-loading-screen.dismissing {
        opacity: 0 !important;
        transform: scale(0.98) !important;
        pointer-events: none !important;
      }
      .streamzy-logo-box {
        width: 104px;
        height: 104px;
        border-radius: 26px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(248, 113, 113, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.1);
        animation: startupLogoPulse 2.2s ease-in-out infinite;
      }
      .streamzy-logo-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .streamzy-startup-title {
        margin-top: 24px;
        font-size: 26px;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.94);
        letter-spacing: -0.03em;
      }
      .streamzy-startup-grad {
        background: linear-gradient(135deg, #f87171 0%, #ec4899 50%, #06b6d4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .streamzy-startup-loader {
        margin-top: 22px;
        width: 120px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .streamzy-startup-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #f87171, #ec4899, #06b6d4);
        border-radius: 999px;
        animation: startupLoaderMove 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes startupLogoPulse {
        0%, 100% { transform: scale(1); opacity: 0.96; }
        50% { transform: scale(1.025); opacity: 1; }
      }
      @keyframes startupLoaderMove {
        0% { left: -45%; width: 30%; }
        50% { left: 30%; width: 55%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body class="bg-[#131317] text-[#e4e1e7] antialiased selection:bg-[#f87171]/30 selection:text-[#ffb3b0]">
    <div id="root"></div>

    <!-- The ONLY Authoritative Streamzy Startup & Loading Screen -->
    <div id="streamzy-loading-screen" aria-label="Loading Streamzy">
      <div class="streamzy-logo-box">
        <img src="/streamzy_logo.jpg" alt="Streamzy" />
      </div>
      <div class="streamzy-startup-title">
        Stream<span class="streamzy-startup-grad">zy</span>
      </div>
      <div class="streamzy-startup-loader">
        <div class="streamzy-startup-bar"></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.dismissStreamzyStartup = function() {
        const screen = document.getElementById('streamzy-loading-screen');
        if (screen && !screen.classList.contains('dismissing')) {
          screen.classList.add('dismissing');
          setTimeout(() => {
            try { screen.remove(); } catch(e) {}
          }, 380);
        }
      };

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
